<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapei Yeak Restaurant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2.5rem 1rem;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        h1 { font-size: 1.6rem; font-weight: 700; text-align: center; }
        p.subtitle { color: var(--text-sub); font-size: 0.95rem; }
        .links-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            background: var(--card-bg);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            border: 1px solid #334155;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .link-btn:active { transform: scale(0.98); }
        .link-btn:hover { border-color: var(--accent); }
        .tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chapei Yeak Restaurant</h1>
        <p class="subtitle">Select an option below</p>
        <div class="links-group">
            
        <a href="https://heyzine.com/flip-book/ed3e862933.html" target="_blank" rel="noopener noreferrer" class="link-btn">
            <span class='tag'>Breakfast Menu</span>            
        </a>
        
		<a href="https://heyzine.com/flip-book/bef597a438.html" target="_blank" rel="noopener noreferrer" class="link-btn">
            <span class='tag'>Lunch & Dinner Menu</span>            
        </a>
		
        <a href="https://heyzine.com/flip-book/7662403942.html" target="_blank" rel="noopener noreferrer" class="link-btn">
            <span class='tag'>Drink Menu</span>            
        </a>
        
        <a href="https://facebook.com/chapeiyeak.kh" target="_blank" rel="noopener noreferrer" class="link-btn">
            <span class='tag'>Facebook Page</span>           
        </a>
        
        <a href="https://www.instagram.com/chapeiyeak_kh" target="_blank" rel="noopener noreferrer" class="link-btn">
            <span class='tag'>Instagram Profile</span>            
        </a>
        
        <a href="https://t.me/yourbrand" target="_blank" rel="noopener noreferrer" class="link-btn">
            <span class='tag'>Contact</span>
            <span class="label">💬 Telegram Channel</span>
        </a>
        
        </div>
    </div>
</body>
</html>
