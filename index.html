<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapei Yeak Restaurant</title>
    <style>
        :root {
            --bg-color: #0c1222;
            --card-bg: #162033;
            --accent: #f59e0b;
            --border-color: #233554;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2.5rem 1.25rem;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }
        /* Top Logo */
        .brand-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background-color: #000;
        }
        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            text-align: center;
        }
        /* Real-time Clock & Date */
        .datetime-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: rgba(22, 32, 51, 0.7);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 20px;
            margin-top: -4px;
        }
        .live-time {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.05em;
        }
        .live-date {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 500;
        }
        p.subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
        }
        .links-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            background: var(--card-bg);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .link-btn:active { transform: scale(0.98); }
        .link-btn:hover { border-color: var(--accent); }
        .tag {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Brand Logo -->
        <img src="logo.png" alt="Chapei Yeak Logo" class="brand-logo">

        <h1>Chapei Yeak Restaurant</h1>

        <!-- Live Clock & Date Display -->
        <div class="datetime-box">
            <span id="live-time" class="live-time">--:--:--</span>
            <span id="live-date" class="live-date">Loading date...</span>
        </div>

        <p class="subtitle">Select an option below</p>

        <div class="links-group">
            <a href="https://heyzine.com/flip-book/ed3e862933.html" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag">BREAKFAST MENU</span>
                <span class="label">🍳 Food Menu</span>
            </a>
            <a href="https://heyzine.com/flip-book/bef597a438.html" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag">LUNCH & DINNER MENU</span>
                <span class="label">🍲 Main Course</span>
            </a>
            <a href="https://heyzine.com/flip-book/7662403942.htm" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag">DRINK MENU</span>
                <span class="label">☕ Beverages</span>
            </a>
            <a href="https://facebook.com/chapeiyeak.kh" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag">FACEBOOK PAGE</span>
                <span class="label">📘 Facebook</span>
            </a>
            <a href="https://www.instagram.com/chapeiyeak_kh" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag">INSTAGRAM PROFILE</span>
                <span class="label">📸 Instagram</span>
            </a>
            <a href="https://t.me/yourbrand" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag">CONTACT</span>
                <span class="label">💬 Telegram Channel</span>
            </a>
        </div>
    </div>

    <!-- Clock Script -->
    <script>
        function updateLiveDateTime() {
            const now = new Date();

            // Time: HH:MM:SS AM/PM
            const timeString = now.toLocaleTimeString([], { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit', 
                hour12: true 
            });

            // Date: Day, Month DD, YYYY
            const dateString = now.toLocaleDateString([], { 
                weekday: 'short', 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });

            document.getElementById('live-time').textContent = timeString;
            document.getElementById('live-date').textContent = dateString;
        }

        // Initialize and refresh every second
        updateLiveDateTime();
        setInterval(updateLiveDateTime, 1000);
    </script>
</body>
</html>
